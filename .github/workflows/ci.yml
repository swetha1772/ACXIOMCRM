name: CI - Build and Test AcxiomCRM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore AcxiomCRM.sln

    - name: Build Solution
      run: dotnet build AcxiomCRM.sln --configuration Release --no-restore

    - name: Run Acceptance & Functional Tests
      run: dotnet run --project AcxiomCRM.Tests/AcxiomCRM.Tests.csproj --configuration Release --no-restore
